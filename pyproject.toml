[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ptflow-fnos"
version = "1.0.9"
description = "PTFlow — 飞牛原生 PT 刷流管理器"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.2", "requests==2.32.5", "waitress==3.0.2", "tzdata==2025.2"]
license = "GPL-3.0-only"

[project.scripts]
ptflow = "ptflow.__main__:main"

[tool.setuptools.package-data]
ptflow = ["static/*"]

[tool.setuptools.packages.find]
include = ["ptflow*"]
