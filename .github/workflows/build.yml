name: Native fnOS FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Run application and packaging unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Require release tag to match package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import os,tomllib; assert os.environ["TAG"] == "v" + tomllib.load(open("pyproject.toml","rb"))["project"]["version"], "Tag/version mismatch"'
      - name: Build self-contained native FPK
        run: ./scripts/build-manual.sh '${{ matrix.arch }}'
      - name: Audit actual package bytes
        run: python scripts/audit-fpk.py dist/*.fpk
      - name: Smoke native package lifecycle and Unix gateway
        run: sudo "$(command -v python)" scripts/smoke-fpk.py dist/*.fpk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ptflow-fpk-${{ matrix.arch }}
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged FPK release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ptflow-fpk-*
          path: dist
          merge-multiple: true
      - name: Publish both architectures and SHA-256 sidecars
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "PTFlow $TAG" --notes "飞牛 fnOS 1.1.3100+ 原生离线包。按 CPU 架构选择 x86_64 或 arm64；安装与安全说明见仓库 README。"
          fi
          gh release upload "$TAG" dist/*.fpk dist/*.sha256 --clobber
